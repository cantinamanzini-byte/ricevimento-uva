<header>
  <div class="t"><b>Lavaggio vasche</b><span id="hdata"></span></div>
  <button class="chi" id="hchi" onclick="vaiA('dati')">—</button>
</header>

<div class="tabs">
  <button id="tb-da"  class="on" onclick="vaiA('da')">Da lavare</button>
  <button id="tb-ok"  onclick="vaiA('ok')">Pronte</button>

  <button id="tb-dati" onclick="vaiA('dati')">Dati</button>
</div>

<div class="wrap" id="wrap"></div>

<script>
/* ===================================================================
   Lavaggio vasche — il terminale di cantina.
   I dati veri stanno nel gestionale: qui si registra e basta.
   Tutto si salva PRIMA nel tablet, e parte quando c'e' linea: in
   cantina il wifi va e viene, e un salvataggio che dipende dalla
   connessione prima o poi mangia una giornata di lavoro.
   =================================================================== */
const VERS='v16';            // scritta qui una volta: compare in testata e in Dati
const STORE='lavaggio_vasche_v1';
const UNITA=['kg','L','g','ml','n.'];
let S, tab='da', form=null;

function oggi(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dIT(s){const p=String(s||'').slice(0,10).split('-');return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function MAI(s){return String(s==null?'':s).toUpperCase()}
function nid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function giorni(d){const a=new Date(String(d).slice(0,10)),b=new Date(oggi());
  if(isNaN(a))return null;return Math.max(0,Math.round((b-a)/86400000))}

function carica(){
  try{S=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){S=null}
  if(!S)S={};
  S.chi=S.chi||'';
  S.operatori=S.operatori||['Stefano','Maikol'];
  S.tipi=S.tipi||['RISCIACQUO','LAVAGGIO','SANITIZZAZIONE'];
  S.prodotti=S.prodotti||[];
  S.vasche=S.vasche||[];          // arriva dal gestionale: {no,tipo,stato,svuotataIl,ultimo}
  S.registro=Array.isArray(S.registro)?S.registro:[];   // i lavaggi scritti sul computer
  S.qual=(S.qual&&typeof S.qual==='object')?S.qual:{};  // prodotto -> detergente/sanitizzante
  S.vascheAgg=S.vascheAgg||'';    // quando e' arrivato
  S.lavaggi=S.lavaggi||[];        // quello che registriamo qui
  S.url=S.url||'';
  salva();
}
function salva(){ try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){} }

/* --- lo stato di una vasca: quello mandato dal gestionale, corretto con
       quello che abbiamo registrato qui e che il gestionale non ha ancora
       visto. Se no registri e la riga resta "da lavare": la seconda volta
       uno non lo fa piu'. --- */
/* Il registro del computer e' l'archivio: una volta che una mia
   registrazione e' arrivata la', se tu la correggi li' comanda quella.
   Finche' non e' partita comando io. Cosi' non ci sono due verita' sulla
   stessa riga, e una data corretta sul computer si vede anche qui. */
function assorbiRegistro(d){
  if(!d)return;
  /* righe che sul computer sono state buttate via: le tolgo anche qui, ma
     solo se erano gia' partite — quello che non ho ancora mandato resta mio */
  if(Array.isArray(d.cancellati) && d.cancellati.length){
    const mor={}; d.cancellati.forEach(x=>{ if(x)mor[String(x)]=true; });
    const prima=S.lavaggi.length;
    S.lavaggi=S.lavaggi.filter(x=>!(x.inviato && mor[String(x.id)]));
    if(S.lavaggi.length!==prima)salva();
  }
  if(!Array.isArray(d.registro))return;
  S.registro=d.registro;
  const pc={};
  d.registro.forEach(r=>{ if(r&&r.id)pc[String(r.id)]=r; });
  (S.lavaggi||[]).forEach(r=>{
    const q=pc[String(r.id)];
    if(!q || !r.inviato)return;              // non partita ancora: resta mia
    if(q.vasca)r.vasca=String(q.vasca);
    if(q.tipo)r.tipo=String(q.tipo);
    if(q.quando)r.quando=String(q.quando);
    r.chi=String(q.chi||r.chi||'');
    r.nota=String(q.nota||'');
    if(typeof q.prodotti!=='undefined')r.prodotti=q.prodotti;
    r.daPc=true;
  });
}
function mioUltimo(no){
  const l=S.lavaggi.filter(x=>String(x.vasca)===String(no));
  l.sort((a,b)=>String(b.quando).localeCompare(String(a.quando)));
  return l[0]||null;
}
/* I prodotti dell'ultimo intervento: se la riga arriva dal gestionale sono
   gia' una frase, se l'ho registrata io qui sono un elenco da comporre. */
/* lo stesso livello del gestionale: acqua, detergente, sanitizzante */
function livello(t){
  const x=String(t||'').toUpperCase();
  const det=/DETERS|DETERG|LAVAGG/.test(x);
  const san=/SANITIZ|STERIL|DISINFE/.test(x);
  if(det&&san)return 'ds';          // il ciclo completo, da guardare per primo
  if(san)return 's';
  if(det)return 'l';
  /* v13: il tampone (acido citrico e simili) ha il suo livello: non e' un
     detergente e non e' un sanitizzante */
  if(/TAMPON|CITRIC|ACIDIFIC/.test(x))return 't';
  if(/RISCIAC|ACQUA/.test(x))return 'r';
  return 'n';
}
/* che cos'e' un prodotto: me lo dice il gestionale */
function qual(nome){ return (S.qual||{})[String(nome||'').trim()]||''; }
function livelloDaProdotti(pr){
  let det=false,san=false,tam=false;
  (pr||[]).forEach(p=>{ const q=qual(p&&p.nome);
    if(q==='DETERGENTE')det=true; if(q==='SANITIZZANTE')san=true; if(q==='TAMPONE')tam=true; });
  if(det&&san)return 'ds';
  if(san)return 's';
  if(det)return 'l';
  if(tam)return 't';   // da solo conta; insieme a un detergente e' parte di quel ciclo
  return '';
}
function nomeLivello(k){ if(!k)return ''; return (S.tipi||[]).find(t=>livello(t)===k)||''; }
/* il livello si accende da solo quando scegli i prodotti, finche' non lo
   tocchi tu: da li' in poi comanda la tua scelta */
function autoTipo(){
  if(!form || form.tipoManuale)return;
  const n=nomeLivello(livelloDaProdotti(form.prodotti));
  if(n)form.tipo=n;
}
function stonaForm(){
  if(!form)return '';
  const k=livelloDaProdotti(form.prodotti); if(!k)return '';
  const suo=livello(form.tipo);
  if(!form.tipo || suo===k || suo==='n')return '';
  return nomeLivello(k);
}
function livTag(t){ return '<span class="liv '+livello(t)+'">'+esc(String(t||'').toUpperCase())+'</span>'; }
function prodTesto(u){
  if(!u)return '';
  if(typeof u.prodotti==='string')return u.prodotti;
  return (u.prodotti||[]).map(p=>[p.nome||'',(String(p.qta||'').trim()!=='')?(p.qta+' '+(p.unita||p.un||'kg')):'']
    .filter(Boolean).join(' ')).filter(Boolean).join(' \u00b7 ');
}
/* Fra quello che ho registrato io e quello che mi ha detto il gestionale,
   l'ultimo e' l'ultimo: lo decide la data, non chi me l'ha dato. Prima
   guardavo solo se la mia registrazione era piu' nuova dell'ultimo scarico,
   e appena scaricavo di nuovo la mattonella tornava a mostrare un lavaggio
   vecchio mentre il registro, qui sotto, diceva un'altra cosa. */
function piuRecente(a,b){
  if(!a)return b||null;
  if(!b)return a;
  return String(a.quando||'')>=String(b.quando||'') ? a : b;
}
function statoDi(v){
  const mio=mioUltimo(v.no);
  const ult=piuRecente(mio,v.ultimo);
  if(v.stato==='PIENA')return {stato:'PIENA',ultimo:ult};
  /* Quello che ho registrato IO dopo aver scaricato l'elenco e' piu' recente
     di qualsiasi cosa mi abbia detto il gestionale: vince, e la vasca passa
     subito fra le pronte. Se no uno registra, guarda, legge ancora "da
     lavare", e la seconda volta non lo fa piu'.
     Non confronto con l'ora dello svuotamento: due apparecchi diversi hanno
     orologi diversi, e un minuto di sfasamento non deve cancellare il lavoro. */
  if(mio && (!S.vascheAgg || String(mio.quando)>=String(S.vascheAgg)))
    return {stato:'PRONTA',ultimo:ult,mio:true};
  if(mio && v.svuotataIl && String(mio.quando)>=String(v.svuotataIl))
    return {stato:'PRONTA',ultimo:ult,mio:true};
  /* se quello che ho qui e' piu' nuovo dello svuotamento, la vasca e' pronta
     anche se il gestionale non lo sa ancora */
  if(ult && v.svuotataIl && String(ult.quando)>=String(v.svuotataIl))
    return {stato:'PRONTA',ultimo:ult};
  return {stato:v.stato||'DA LAVARE',ultimo:ult};
}
function vascheCon(st){
  return S.vasche.map(v=>({v:v,s:statoDi(v)})).filter(x=>x.s.stato===st)
    .sort((a,b)=>String(a.v.no).localeCompare(String(b.v.no),'it',{numeric:true}));
}
function daMandare(){ return S.lavaggi.filter(x=>!x.inviato).length }

/* ===================== schermate ===================== */
function vaiA(t){ tab=t; form=null; disegna(); window.scrollTo({top:0}); }
function disegna(){
  document.getElementById('hdata').textContent=dIT(oggi())+' · '+ora()+' · '+VERS;
  document.getElementById('hchi').textContent=S.chi||'chi sei?';
  ['da','ok','reg','dati'].forEach(k=>{
    const b=document.getElementById('tb-'+k); if(b)b.classList.toggle('on',tab===k);
  });
  const st=document.getElementById('stato');
  const n=daMandare();
  if(n){ st.className='stato att'; st.innerHTML='<b>'+n+'</b> '+(n===1?'registrazione da mandare':'registrazioni da mandare')+' al gestionale'; }
  else { st.className='stato ok'; st.innerHTML='Tutto mandato.'+(S.vascheAgg?(' Vasche aggiornate il '+esc(dIT(S.vascheAgg))+' '+esc(String(S.vascheAgg).slice(11,16))):''); }
  const w=document.getElementById('wrap');
  if(form){ w.innerHTML=schermoForm(); return; }
  if(tab==='da')   w.innerHTML=schermoLista('DA LAVARE');
  else if(tab==='ok') w.innerHTML=schermoLista('PRONTA');
  else if(tab==='reg') w.innerHTML=schermoRegistro();
  else w.innerHTML=schermoDati();
}

/* v13: filtro per livello sulla scheda PRONTE. Non lo salvo apposta: quando
   riapri il programma vedi sempre tutte le vasche. Un filtro acceso non si
   vede, e qui si decide dove va il vino. */
let filtro='';
function filtroSet(k){ filtro=(filtro===k?'':k); disegna(); window.scrollTo({top:0}); }
function filtroVia(){ filtro=''; disegna(); window.scrollTo({top:0}); }
function barraFiltro(tutte){
  const tipi=S.tipi||[];
  if(!tipi.length)return '';
  const conta=(k)=>tutte.filter(x=>x.s.ultimo&&livello(x.s.ultimo.tipo)===k).length;
  const b=tipi.map(t=>{
    const k=livello(t), n=conta(k);
    if(!n)return '<span class="liv '+k+'" style="opacity:.3">'+esc(String(t).toUpperCase())+' 0</span>';
    return '<button class="liv '+k+' filtro'+(filtro===k?' on':'')+'" onclick="filtroSet(\''+k+'\')">'
      +esc(String(t).toUpperCase())+' '+n+'</button>';
  }).join('');
  return '<div class="card filtri">'+b
    +(filtro?'<button class="mostratutte" onclick="filtroVia()">\u2715 Mostra tutte le vasche</button>':'')+'</div>';
}

function tankTab(v,da){
  const t=String(v.tipo||'');
  const k=/vinific/i.test(t)?'vin':(/autocl/i.test(t)?'aut':'cis');
  const c=TK[k], r=c.w*0.27, cx=c.w*c.cx, cy=c.h*c.b, no=String(v.no||'');
  return '<span class="vtk"><svg viewBox="0 0 '+c.w+' '+c.h+'"><image href="'+c.u+'" x="0" y="0" width="'+c.w+'" height="'+c.h+'"/>'
    +'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(da?'#c0392b':'#4a4038')+'" stroke="#fff" stroke-width="'+(r*0.16).toFixed(1)+'"/>'
    +'<text x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-weight="900" fill="#fff" font-size="'+(r*(no.length>1?1.15:1.3)).toFixed(1)+'">'+no+'</text></svg></span>';
}
function schermoLista(st){
  if(!S.vasche.length)
    return '<div class="card"><div class="vuoto">Non ho ancora l\'elenco delle vasche.<br><br>'
      +'Vai su <b>Dati</b> e premi <b>Scarica dal gestionale</b>.</div></div>';
  let l=vascheCon(st);
  let testa='';
  if(st==='PRONTA'){
    testa=barraFiltro(l);
    if(filtro){
      const tot=l.length;
      l=l.filter(x=>x.s.ultimo&&livello(x.s.ultimo.tipo)===filtro);
      testa+='<div class="card vuoto" style="padding:10px 14px;font-size:15px">'
        +'<b>'+l.length+'</b> vasche su '+tot+' \u00b7 filtro '+esc(nomeLivello(filtro)||filtro)+'</div>';
    }
  }
  if(!l.length)
    return testa+'<div class="card"><div class="vuoto">'+(st==='DA LAVARE'
      ? 'Nessuna vasca da lavare.<br>Quando il gestionale ne svuota una, compare qui.'
      : (filtro?'Nessuna vasca pronta con questo livello.':'Nessuna vasca pronta.'))+'</div></div>';
  return testa+l.map(x=>{
    const v=x.v, s=x.s, gg=v.svuotataIl?giorni(v.svuotataIl):null;
    const sotto = st==='DA LAVARE'
      ? (v.svuotataIl?('vuota dal '+esc(dIT(v.svuotataIl))+(gg!==null?(' · '+(gg===0?'oggi':gg+(gg===1?' giorno':' giorni'))):'')):'vuota')
        +(s.ultimo?('<br>prima: '+livTag(s.ultimo.tipo)+' del '+esc(dIT(s.ultimo.quando))
            +(prodTesto(s.ultimo)?('<br><span class="prod">'+esc(prodTesto(s.ultimo))+'</span>'):''))
          :'<br>nessun lavaggio registrato')
      : (s.ultimo?(livTag(s.ultimo.tipo)+' del '+esc(dIT(s.ultimo.quando))+(s.ultimo.chi?(' · '+esc(s.ultimo.chi)):'')
            +(prodTesto(s.ultimo)?('<br><span class="prod">'+esc(prodTesto(s.ultimo))+'</span>'):'')):'');
    const col = st==='DA LAVARE' ? 'da' : (s.ultimo ? 'liv-'+livello(s.ultimo.tipo) : 'ok');
    return '<div class="card '+col+'">'
      +'<button class="vcard" onclick="apriForm(\''+esc(v.no)+'\')">'+tankTab(v,st==='DA LAVARE')
      +'<span class="vno"><b>'+esc(((v.tipo||'')+' '+v.no).trim())+'</b><span>'+sotto+'</span></span>'
      +'<span class="vgo">'+(st==='DA LAVARE'?'Registra':'rifai')+'</span></button></div>';
  }).join('');
}

function apriForm(no){
  if(!S.chi){ alert('Prima dimmi chi sei: premi il pulsante in alto a destra.'); vaiA('dati'); return; }
  const v=S.vasche.find(x=>String(x.no)===String(no))||{no:no,tipo:''};
  form={vasca:String(no), tipo:'', prodotti:[], nota:'', tipoVasca:v.tipo||'',
        data:oggi(), ora:ora(), quandoAperto:false};
  disegna(); window.scrollTo({top:0});
}
function fSet(k,val){ form[k]=val; if(k==='tipo')form.tipoManuale=true; disegna(); }
function fProdAdd(){ const u=form.prodotti[form.prodotti.length-1];
  form.prodotti.push({nome:'',qta:'',un:(u&&u.un)||'kg'}); autoTipo(); disegna(); }
function fProdUpd(i,k,val){ form.prodotti[i][k]=(k==='nome')?MAI(val):val; if(k==='nome'){ autoTipo(); disegna(); } }
function fProdDel(i){ form.prodotti.splice(i,1); autoTipo(); disegna(); }
function fAnnulla(){ form=null; disegna(); }

function schermoForm(){
  const v=form;
  const prod=v.prodotti.map((p,i)=>
    '<div class="row" style="margin-bottom:9px">'
    +'<div class="field" style="margin:0;flex:1 1 auto"><select onchange="fProdUpd('+i+',\'nome\',this.value)">'
      +'<option value="">— prodotto —</option>'
      +S.prodotti.map(x=>'<option'+(x===p.nome?' selected':'')+'>'+esc(x)+'</option>').join('')
      +'</select></div>'
    +'<div class="field" style="margin:0;flex:0 0 96px"><input inputmode="decimal" placeholder="quanto" value="'+esc(p.qta)+'" onchange="fProdUpd('+i+',\'qta\',this.value)"></div>'
    +'<div class="field" style="margin:0;flex:0 0 92px"><select onchange="fProdUpd('+i+',\'un\',this.value)">'
      +UNITA.map(u=>'<option'+(u===p.un?' selected':'')+'>'+u+'</option>').join('')+'</select></div>'
    +'<button class="iconbtn" onclick="fProdDel('+i+')" aria-label="Togli">✕</button></div>').join('');

  return '<div class="card">'
    +'<div class="sec-t">VASCA</div>'
    +'<div style="font-size:27px;font-weight:800;margin-bottom:4px">'+esc(((v.tipoVasca||'')+' '+v.vasca).trim())+'</div>'
    + (v.quandoAperto
       ? '<div class="row" style="margin-top:6px">'
         +'<div class="field" style="margin:0;flex:1 1 auto"><label for="fd">Giorno</label>'
         +'<input id="fd" type="date" value="'+esc(v.data||oggi())+'" onchange="fSet(\'data\',this.value)"></div>'
         +'<div class="field" style="margin:0;flex:0 0 130px"><label for="fo">Ora</label>'
         +'<input id="fo" type="time" value="'+esc(v.ora||ora())+'" onchange="fSet(\'ora\',this.value)"></div>'
         +'</div>'
       : '<div class="hint" style="margin-top:0">'+esc(dIT(v.data||oggi()))+' · '+esc(v.ora||ora())+' · '+esc(S.chi)
         +' <button class="mini" onclick="fApriQuando()">Cambia</button></div>')
    +'</div>'

    +'<div class="card"><div class="sec-t">COSA HAI FATTO</div><div class="seg">'
    + S.tipi.map(t=>'<button class="'+(v.tipo===t?('on '+livello(t)):'')+'" onclick="fSet(\'tipo\',\''+esc(t)+'\')">'+esc(t)+'</button>').join('')
    +'</div>'
    + (stonaForm()?('<div class="hint" style="color:#8a5a00;font-weight:700;margin-top:10px">Dai prodotti sembra <b>'+esc(stonaForm())+'</b>. '
        +'<button class="mini" onclick="form.tipoManuale=false;autoTipo();disegna()">Correggi</button></div>'):'')
    +'</div>'

    +'<div class="card"><div class="sec-t">PRODOTTI</div>'
    + (prod||'<div class="hint" style="margin:0 0 9px">Nessun prodotto. Per un risciacquo va bene così.</div>')
    + '<button class="ghost" onclick="fProdAdd()">+ Prodotto</button>'
    + (S.prodotti.length?'':'<div class="hint">L\'elenco dei prodotti è vuoto: lo riempi dal gestionale, poi premi <b>Scarica dal gestionale</b>.</div>')
    +'</div>'

    +'<div class="card"><div class="field" style="margin:0"><label for="nt">Nota (se serve)</label>'
    +'<textarea id="nt" placeholder="es. guarnizione portello da cambiare" onchange="form.nota=this.value">'+esc(v.nota)+'</textarea></div></div>'

    +'<button class="big" onclick="fSalva()">Conferma</button>'
    +'<div style="height:9px"></div>'
    +'<button class="ghost" onclick="fAnnulla()">Annulla</button>'
    +'<div style="height:22px"></div>';
}

function fApriQuando(){ form.quandoAperto=true; disegna(); }
function fSalva(){
  if(!form.tipo){ alert('Scegli cosa hai fatto: risciacquo, lavaggio o sanitizzazione.'); return; }
  /* normalmente data e ora sono quelle di adesso; se le hai cambiate perche'
     stai recuperando il lavaggio di ieri, valgono quelle */
  const q=(form.data||oggi())+' '+(form.ora||ora());
  if(q.slice(0,10)>oggi() && !confirm('Hai messo una data in avanti: '+dIT(form.data)+'.\n\nVa bene lo stesso?'))return;
  const r={id:nid(), vasca:form.vasca, tipo:form.tipo,
    quando:q, chi:S.chi,
    prodotti:form.prodotti.filter(p=>p.nome),
    nota:form.nota||'', inviato:false, da:'tablet'};
  S.lavaggi.push(r); salva();
  form=null; tab='da'; disegna();
  prova();   // se c'e' linea parte subito, se no resta qui e parte dopo
}

/* Il registro e' uno solo: quello che ho scritto qui piu' quello scritto
   sul computer. Se una riga c'e' da tutte e due le parti (perche' l'ho
   mandata io e il computer me l'ha rimandata indietro) vale la mia, che sa
   anche se e' partita o no. */
function registroUnito(){
  const visti={}, out=[];
  S.lavaggi.forEach(r=>{ visti[String(r.id)]=true; out.push(r); });
  (S.registro||[]).forEach(r=>{ if(!r||visti[String(r.id)])return; visti[String(r.id)]=true;
    out.push({id:r.id, vasca:r.vasca, tipo:r.tipo, quando:r.quando, chi:r.chi||'',
      prodotti:r.prodotti||'', nota:r.nota||'', inviato:true, dalPc:true}); });
  return out.sort((a,b)=>String(b.quando||'').localeCompare(String(a.quando||''))).slice(0,80);
}
function schermoRegistro(){
  const l=registroUnito();
  if(!l.length)return '<div class="card"><div class="vuoto">Niente registrato per adesso.</div></div>';
  return '<div class="card">'+l.map(r=>
    '<div class="reg"><b>'+esc(r.vasca)+'</b> '+livTag(r.tipo)+' '
    +(r.dalPc?'<span class="pill">dal computer</span>'
      :(r.inviato?'<span class="pill ok">mandato</span>':'<span class="pill att">da mandare</span>'))
    +'<div class="m">'+esc(dIT(r.quando))+' '+esc(String(r.quando).slice(11,16))+' · '+esc(r.chi||'')
    +(prodTesto(r)?('<br>'+esc(prodTesto(r))):'')
    +(r.nota?('<br>'+esc(r.nota)):'')
    +'</div></div>').join('')+'</div>';
}

function schermoDati(){
  return '<div class="card"><div class="sec-t">CHI STA REGISTRANDO</div><div class="seg">'
    + S.operatori.map(o=>'<button class="'+(S.chi===o?'on':'')+'" onclick="setChi(\''+esc(o)+'\')">'+esc(o)+'</button>').join('')
    +'</div><div class="hint">Lo scegli una volta: poi il tablet lo scrive da solo su ogni registrazione.</div></div>'

    +'<div class="card"><div class="sec-t">COLLEGAMENTO AL GESTIONALE</div>'
    +'<div class="field"><label for="u">Indirizzo del foglio</label>'
    +'<input id="u" value="'+esc(S.url)+'" placeholder="incolla qui l\'indirizzo" onchange="S.url=this.value.trim();salva();disegna()"></div>'
    +'<button class="big sec" onclick="scarica()">Scarica dal gestionale</button>'
    +'<div style="height:9px"></div>'
    +'<button class="ghost" onclick="prova()">Manda quello che ho registrato'+(daMandare()?(' ('+daMandare()+')'):'')+'</button>'
    +'<div class="hint">Le registrazioni si salvano <b>sempre</b> nel tablet, anche senza linea: partono da sole appena il segnale torna.</div>'
    +'</div>'

    +'<div class="card"><div class="sec-t">COME STA ANDANDO</div>'
    +'<div class="hint" style="margin:0">Vasche conosciute: <b>'+S.vasche.length+'</b>'
    +(S.vascheAgg?(', aggiornate il '+esc(dIT(S.vascheAgg))+' '+esc(String(S.vascheAgg).slice(11,16))):', mai scaricate')
    +'<br>Registrazioni sul tablet: <b>'+S.lavaggi.length+'</b>, da mandare: <b>'+daMandare()+'</b>'
    +'<br>Prodotti in elenco: <b>'+S.prodotti.length+'</b></div></div>'

    +'<div class="card"><div class="sec-t">SE LA LINEA NON VA</div>'
    +'<button class="ghost" onclick="copiaFuori()">Copia le registrazioni</button>'
    +'<div style="height:9px"></div>'
    +'<button class="ghost" onclick="incollaDentro()">Incolla le vasche dal gestionale</button>'
    +'<div class="hint">La riserva di sempre: si copia e si incolla a mano, come su Ricevimento uva.</div></div>'
    +'<div class="card"><div class="sec-t">PROGRAMMA</div>'
    +'<div style="font-size:21px;font-weight:800">Lavaggio vasche '+esc(VERS)+'</div>'
    +'<div class="hint">Se Stefano ti ha detto di aggiornare e qui c\'\u00e8 ancora il numero vecchio, '
    +'chiudi del tutto la pagina e riaprila: il tablet sta ancora usando quella tenuta in memoria.</div>'
    +'<button class="ghost" onclick="location.reload(true)">Ricarica il programma</button></div>'
    +'<div style="height:22px"></div>';
}
function setChi(o){ S.chi=o; salva(); disegna(); }

/* ===================== collegamento ===================== */
/* da solo, senza dire niente: quando si apre e ogni tre minuti.
   Se non c'e' linea non succede nulla di male: si riprova dopo. */
function scaricaZitto(){
  if(!S.url)return;
  fetch(S.url+(S.url.indexOf('?')<0?'?':'&')+'cosa=vasche')
    .then(r=>r.json())
    .then(d=>{
      if(!d||!Array.isArray(d.vasche))return;
      S.vasche=d.vasche;
      assorbiRegistro(d);
      if(d.qualifiche&&typeof d.qualifiche==='object')S.qual=d.qualifiche;
      if(Array.isArray(d.prodotti))S.prodotti=d.prodotti;
      if(Array.isArray(d.operatori)&&d.operatori.length)S.operatori=d.operatori;
      if(Array.isArray(d.tipi)&&d.tipi.length)S.tipi=d.tipi;
      S.vascheAgg=oggi()+' '+ora(); salva();
      if(!form)disegna();          // se sta compilando, non gli muovo la schermata sotto le mani
    })
    .catch(()=>{});
}
function scarica(){
  if(!S.url){ alert('Manca l\'indirizzo del foglio. Lo trovi nel gestionale, nella pagina Lavaggi, in fondo.'); return; }
  fetch(S.url+(S.url.indexOf('?')<0?'?':'&')+'cosa=vasche')
    .then(r=>r.json())
    .then(d=>{
      if(!d || !Array.isArray(d.vasche))throw new Error('risposta strana');
      S.vasche=d.vasche;
      assorbiRegistro(d);
      if(d.qualifiche&&typeof d.qualifiche==='object')S.qual=d.qualifiche;
      if(Array.isArray(d.prodotti))S.prodotti=d.prodotti;
      if(Array.isArray(d.operatori)&&d.operatori.length)S.operatori=d.operatori;
      if(Array.isArray(d.tipi)&&d.tipi.length)S.tipi=d.tipi;
      S.vascheAgg=oggi()+' '+ora(); salva(); disegna();
      alert('Scaricate '+S.vasche.length+' vasche dal gestionale.');
    })
    .catch(e=>alert('Non sono riuscito a scaricare.\n\nControlla la linea e l\'indirizzo.\n\n('+e.message+')'));
}
function prova(){
  const da=S.lavaggi.filter(x=>!x.inviato);
  if(!da.length || !S.url){ disegna(); return; }
  fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({cosa:'lavaggi',righe:da})})
    .then(r=>r.json())
    .then(d=>{ if(d&&d.ok){ da.forEach(x=>x.inviato=true); salva(); } disegna(); })
    .catch(()=>{ disegna(); });   // niente linea: restano qui e riproviamo dopo
}
function copiaFuori(){
  const t=JSON.stringify({cosa:'lavaggi',righe:S.lavaggi.filter(x=>!x.inviato)});
  navigator.clipboard.writeText(t).then(
    ()=>alert('Copiato. Incollalo nel gestionale, nella pagina Lavaggi: Incolla i lavaggi.'),
    ()=>prompt('Copia questo testo e incollalo nel gestionale, in Lavaggi:',t));
}
function incollaDentro(){
  const t=prompt('Incolla qui il testo delle vasche copiato dal gestionale:','');
  if(!t)return;
  try{
    const d=JSON.parse(t);
    if(!d||!Array.isArray(d.vasche))throw new Error('non è l\'elenco delle vasche');
    S.vasche=d.vasche;
    assorbiRegistro(d);
    if(d.qualifiche&&typeof d.qualifiche==='object')S.qual=d.qualifiche;
    if(Array.isArray(d.prodotti))S.prodotti=d.prodotti;
    if(Array.isArray(d.operatori)&&d.operatori.length)S.operatori=d.operatori;
    if(Array.isArray(d.tipi)&&d.tipi.length)S.tipi=d.tipi;
    S.vascheAgg=oggi()+' '+ora(); salva(); disegna();
    alert('Caricate '+S.vasche.length+' vasche.');
  }catch(e){ alert('Non ho capito il testo.\n\n('+e.message+')'); }
}

/* il QR sulla vasca e' un indirizzo con il numero dentro: ?vasca=25.
   Si inquadra con la fotocamera del tablet, si apre questa pagina e
   siamo gia' sulla vasca giusta. Nessun lettore da installare. */
function daIndirizzo(){
  const m=location.search.match(/[?&]vasca=([^&]+)/);
  if(m){ const no=decodeURIComponent(m[1]); if(S.chi)apriForm(no); }
}

window.addEventListener('online',()=>{ prova(); scaricaZitto(); });
carica(); disegna(); daIndirizzo(); prova();
setTimeout(scaricaZitto,1500);
setInterval(()=>{ scaricaZitto(); prova(); },180000);
</script>
